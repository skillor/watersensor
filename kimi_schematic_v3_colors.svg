<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #ffffff;">

  <defs>
    <path id="res-h" d="M0,0 L4,-6 L12,6 L20,-6 L28,6 L32,0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="res-v" d="M0,0 L6,-4 L-6,12 L6,20 L-6,28 L0,32" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="npn">
      <circle cx="0" cy="0" r="32" stroke="#222" stroke-width="2" fill="none"/>
      <line x1="-12" y1="-20" x2="-12" y2="20" stroke="#222" stroke-width="3"/>
      <line x1="-12" y1="-10" x2="14" y2="-28" stroke="#222" stroke-width="2.5"/>
      <line x1="-12" y1="10" x2="14" y2="28" stroke="#222" stroke-width="2.5"/>
      <polygon points="8,-22 14,-28 6,-26" fill="#222"/>
      <text x="20" y="-30" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#111">C</text>
      <text x="-28" y="4" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#111">B</text>
      <text x="20" y="32" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#111">E</text>
    </g>
  </defs>

  <style>
    .wire-5v  { stroke: #dc3545; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire-3v3 { stroke: #fd7e14; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire-gnd { stroke: #343a40; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire-sig { stroke: #0d6efd; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire-ctl { stroke: #198754; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .comp { stroke: #222222; stroke-width: 2; fill: #ffffff; }
    .txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #111111; }
    .txt-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #111111; }
    .txt-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; }
    .dot-5v  { fill: #dc3545; }
    .dot-3v3 { fill: #fd7e14; }
    .dot-gnd { fill: #343a40; }
    .dot-sig { fill: #0d6efd; }
    .dot-ctl { fill: #198754; }
  </style>

  <!-- ==================== COMMON RAILS ==================== -->
  <!-- GND Rail (Bottom) -->
  <line x1="80" y1="580" x2="800" y2="580" class="wire-gnd" />
  <!-- V+ Rail (Top) — Battery / 5V -->
  <line x1="80" y1="80" x2="420" y2="80" class="wire-5v" />
  <circle cx="420" cy="80" r="5" class="dot-5v" />

  <!-- ==================== BATTERY ==================== -->
  <text x="80" y="270" text-anchor="end" class="txt-title">3xAA Battery Pack</text>
  <text x="80" y="295" text-anchor="end" class="txt">(4.5V Fresh)</text>

  <!-- Battery Symbol -->
  <line x1="60" y1="240" x2="100" y2="240" stroke="#111" stroke-width="2"/>
  <line x1="70" y1="260" x2="90" y2="260" stroke="#111" stroke-width="5"/>
  <line x1="60" y1="280" x2="100" y2="280" stroke="#111" stroke-width="2"/>
  <line x1="70" y1="300" x2="90" y2="300" stroke="#111" stroke-width="5"/>
  <text x="45" y="235" class="txt-bold" fill="#dc3545">+</text>
  <text x="45" y="315" class="txt-bold" fill="#343a40">-</text>

  <!-- Battery Connections -->
  <line x1="80" y1="240" x2="80" y2="80" class="wire-5v"/>
  <line x1="80" y1="300" x2="80" y2="580" class="wire-gnd"/>
  <circle cx="80" cy="580" r="5" class="dot-gnd"/>

  <!-- ==================== VOLTAGE DIVIDER ==================== -->
  <circle cx="220" cy="80" r="5" class="dot-5v" />
  <line x1="220" y1="80" x2="220" y2="160" class="wire-5v" />

  <!-- 1MΩ Resistor 1 -->
  <use href="#res-v" x="220" y="160"/>
  <text x="245" y="200" class="txt-bold">1MΩ</text>

  <!-- Node to A0 -->
  <line x1="220" y1="192" x2="220" y2="280" class="wire-5v" />
  <circle cx="220" cy="280" r="5" class="dot-5v" />
  <line x1="220" y1="280" x2="350" y2="280" class="wire-sig" />
  <polygon points="330,276 350,280 330,284" fill="#0d6efd"/>
  <text x="285" y="272" class="txt-bold" fill="#0d6efd">A0</text>

  <!-- 1MΩ Resistor 2 -->
  <line x1="220" y1="280" x2="220" y2="310" class="wire-5v" />
  <use href="#res-v" x="220" y="310"/>
  <text x="245" y="350" class="txt-bold">1MΩ</text>

  <!-- To GND -->
  <line x1="220" y1="342" x2="220" y2="580" class="wire-gnd" />
  <circle cx="220" cy="580" r="5" class="dot-gnd" />

  <!-- ==================== XIAO ESP32-C6 ==================== -->
  <rect x="350" y="150" width="150" height="250" class="comp" rx="8" />
  <text x="425" y="265" text-anchor="middle" class="txt-title">XIAO</text>
  <text x="425" y="285" text-anchor="middle" class="txt-title">ESP32-C6</text>

  <!-- Pins -->
  <text x="355" y="285" class="txt" fill="#0d6efd">[A0]</text>
  <text x="420" y="170" text-anchor="middle" class="txt" fill="#dc3545">[5V]</text>
  <text x="475" y="170" text-anchor="middle" class="txt" fill="#343a40">[GND]</text>
  <text x="460" y="235" class="txt" fill="#fd7e14">[3V3]</text>
  <text x="465" y="295" class="txt" fill="#0d6efd">[D2]</text>
  <text x="465" y="335" class="txt" fill="#198754">[D3]</text>
  <text x="465" y="375" class="txt" fill="#198754">[D1]</text>

  <!-- 5V Routing to XIAO -->
  <line x1="420" y1="150" x2="420" y2="80" class="wire-5v" />
  <!-- GND Routing to XIAO -->
  <line x1="475" y1="150" x2="475" y2="120" class="wire-gnd" />
  <line x1="475" y1="120" x2="525" y2="120" class="wire-gnd" />
  <line x1="525" y1="120" x2="525" y2="580" class="wire-gnd" />
  <circle cx="525" cy="580" r="5" class="dot-gnd" />

  <!-- ==================== 3V3 POWER & CAPACITOR ==================== -->
  <line x1="500" y1="230" x2="580" y2="230" class="wire-3v3" />
  <circle cx="580" cy="230" r="5" class="dot-3v3" />

  <!-- Route Up to Sensor VCC -->
  <line x1="580" y1="230" x2="580" y2="170" class="wire-3v3" />
  <line x1="580" y1="170" x2="780" y2="170" class="wire-3v3" />
  <polygon points="760,166 780,170 760,174" fill="#fd7e14"/>
  <text x="715" y="166" class="txt-bold" fill="#fd7e14">VCC</text>

  <!-- Route Down to Capacitor -->
  <line x1="580" y1="230" x2="580" y2="460" class="wire-3v3" />

  <!-- Capacitor Symbol -->
  <line x1="560" y1="460" x2="600" y2="460" stroke="#111" stroke-width="4" />
  <line x1="560" y1="470" x2="600" y2="470" stroke="#111" stroke-width="4" />
  <text x="610" y="470" class="txt-bold">1000µF</text>
  <text x="545" y="455" class="txt-bold" fill="#fd7e14">+</text>
  <text x="545" y="480" class="txt-bold" fill="#343a40">-</text>

  <!-- Cap to GND -->
  <line x1="580" y1="470" x2="580" y2="580" class="wire-gnd" />
  <circle cx="580" cy="580" r="5" class="dot-gnd" />

  <!-- ==================== D2 → TRIG ==================== -->
  <line x1="500" y1="290" x2="680" y2="290" class="wire-ctl" />
  <line x1="680" y1="290" x2="680" y2="210" class="wire-ctl" />
  <line x1="680" y1="210" x2="780" y2="210" class="wire-ctl" />
  <polygon points="760,206 780,210 760,214" fill="#198754"/>
  <text x="715" y="206" class="txt-bold" fill="#198754">TRIG</text>

  <!-- ==================== D3 → ECHO (through NPN Collector) ==================== -->
  <line x1="500" y1="330" x2="720" y2="330" class="wire-sig" />
  <line x1="720" y1="330" x2="720" y2="250" class="wire-sig" />
  <line x1="720" y1="250" x2="780" y2="250" class="wire-sig" />
  <polygon points="760,246 780,250 760,254" fill="#0d6efd"/>
  <text x="715" y="246" class="txt-bold" fill="#0d6efd">ECHO</text>

  <!-- ==================== D1, 1kΩ RESISTOR & NPN BJT ==================== -->
  <line x1="500" y1="370" x2="550" y2="370" class="wire-ctl" />
  <use href="#res-h" x="550" y="370"/>
  <text x="575" y="355" text-anchor="middle" class="txt-bold">1kΩ</text>

  <line x1="582" y1="370" x2="690" y2="370" class="wire-ctl" />

  <use href="#npn" x="715" y="370"/>
  <text x="760" y="375" class="txt-title" font-size="14">NPN</text>

  <!-- BJT Collector to Sensor GND -->
  <line x1="729" y1="342" x2="729" y2="290" class="wire-gnd" />
  <line x1="729" y1="290" x2="780" y2="290" class="wire-gnd" />
  <polygon points="760,286 780,290 760,294" fill="#343a40"/>
  <text x="715" y="286" class="txt-bold" fill="#343a40">GND</text>

  <!-- BJT Emitter to Common GND -->
  <line x1="729" y1="398" x2="729" y2="580" class="wire-gnd" />
  <circle cx="729" cy="580" r="5" class="dot-gnd" />

  <!-- ==================== AJ-SR04N SENSOR ==================== -->
  <rect x="780" y="140" width="130" height="180" class="comp" rx="5" />
  <text x="845" y="220" text-anchor="middle" class="txt-title">AJ-SR04N</text>
  <text x="845" y="240" text-anchor="middle" class="txt-title">Sensor</text>

  <text x="785" y="175" class="txt" fill="#fd7e14">[VCC]</text>
  <text x="785" y="215" class="txt" fill="#198754">[TRIG]</text>
  <text x="785" y="255" class="txt" fill="#0d6efd">[ECHO]</text>
  <text x="785" y="295" class="txt" fill="#343a40">[GND]</text>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(820, 400)">
    <text x="0" y="0" class="txt-title" font-size="12">Legend</text>
    <line x1="0" y1="15" x2="20" y2="15" class="wire-5v"/>
    <text x="28" y="19" class="txt" font-size="11">5V / Battery</text>
    <line x1="0" y1="35" x2="20" y2="35" class="wire-3v3"/>
    <text x="28" y="39" class="txt" font-size="11">3V3 / Sensor VCC</text>
    <line x1="0" y1="55" x2="20" y2="55" class="wire-gnd"/>
    <text x="28" y="59" class="txt" font-size="11">GND</text>
    <line x1="0" y1="75" x2="20" y2="75" class="wire-sig"/>
    <text x="28" y="79" class="txt" font-size="11">Signal (D3/ECHO)</text>
    <line x1="0" y1="95" x2="20" y2="95" class="wire-ctl"/>
    <text x="28" y="99" class="txt" font-size="11">Control (D1/D2/TRIG)</text>
  </g>

</svg>